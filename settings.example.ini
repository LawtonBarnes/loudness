[vizmic]
# ALSA capture device for the USB mic. "default" often works, but USB
# audio devices are safer addressed directly -- run `arecord -l` on the
# Pi to find the card/device index (e.g. card 1) and use "plughw:1,0"
# (the "plug" prefix lets ALSA convert rate/format if the mic doesn't
# support 44100/S16LE natively, instead of erroring out).
#
# Shared fleet mic (2026-11-07): `device = net:mp` reads the gooseneck on MP
# over the network instead (micserver.py / micserver.service on MP, UDP
# 8440). With the gooseneck, use silence_db = -63 and band_offsets all 0.
device = plughw:1,0

# Number of vertical bars across the drawing area.
num_bars = 9

# Fraction of the 720x480 frame the bars are drawn into, centered, with
# the rest left black -- a border to compensate for CRT bezel overscan.
# 1.0 = fills the frame edge to edge.
underscan_scale = 0.8

# Extra vertical-only shrink applied on top of underscan_scale, to grow
# the top/bottom margins (where the title and legend sit) without
# affecting their font size or the bars' width. 1.0 = no extra shrink.
bar_height_scale = 0.9

# Black pixels of horizontal space between adjacent bar columns.
bar_gap = 14

# LED-matrix look: each bar is a stack of fixed-height segments (rungs)
# with a black gap between them, rather than one solid rectangle.
# led_height = pixel height of each lit segment.
# led_gap = black pixels between segments.
led_height = 10
led_gap = 4

# Minimum lit segments per bar, always -- an idle baseline so the
# display still reads as "on" at true silence instead of going fully
# dark. Independent of the auto-gain ceiling above (that one governs
# how loud noise has to be to light bars *beyond* this floor).
min_rungs = 1

# Ceiling, in dB, on the auto-gain (bars cover a fixed 60dB range below
# full scale -- gain continuously self-adjusts so recent peaks land near
# the top without pegging, no keyboard needed). This caps how far it can
# boost a quiet room: during real silence there's no peak to chase, so
# without a ceiling gain would climb indefinitely amplifying mic
# self-noise/room hiss. If bars still show a few lit at true silence,
# lower this -- it's the practical way to tune that floor away without
# a keyboard. Also adjustable live in 3dB steps with Up/Down when one
# *is* attached.
sensitivity = 30

# Absolute dBFS threshold (pre-gain) below which the auto-gain treats
# input as "not really there" and stops reacting to it -- without this,
# a "quiet" room isn't perfectly constant (mic self-noise/room hiss
# wobbles frame to frame), and the auto-gain's fast-attack peak
# tracking chases every little wobble, visibly breathing/pumping the
# bars even with nothing happening. Raise it if that breathing is still
# visible in your quietest conditions; lower it if real quiet passages
# in music stop registering.
noise_gate_db = -20

# Frequency range covered by the bars, log-spaced (so bass isn't
# cramped into a couple of bars the way linear spacing would do).
low_freq = 50
high_freq = 12000

# Extra gain, in dB, ramped in linearly from the lowest bar to the
# highest. Music carries more energy in bass/mids than treble, so a
# flat scale makes the spectrum trail off toward the right -- this
# tilts it back toward level. 0 disables it.
treble_boost = 12

# Cut, in dB, at the lowest bar (ramped out by the top bar, mirroring
# treble_boost). Low-frequency rumble (traffic, HVAC, building
# vibration) is real, not a bug, but it's also loud enough by itself to
# drag the shared auto-gain down to protect it from clipping -- which
# simultaneously starves every other band of gain. This tames bass at
# the display level *and* lets the auto-gain stop compromising for it,
# instead of raising noise_gate_db further (which only pushes bass
# toward pegging harder, since it's already above that gate). 0
# disables it.
bass_cut_db = 16

# Per-band dead zone, in dB, at the bottom of each bar's own display
# range (applied after gain and bass_cut_db, unlike noise_gate_db which
# only stabilizes the single shared auto-gain value). Bars cover a 60dB
# range across ~20-something rungs, so each rung is only a couple dB --
# normal statistical wobble in the FFT magnitude estimate can cross
# several rung boundaries on its own even with gain rock-stable, and
# bass tends to carry more of that wobble (real rumble, and mic
# self-noise that's typically worse at low frequencies). Below this
# threshold a band reads as exactly 0 -- combined with min_rungs, a
# solid single division instead of jitter across a few. Raise it if a
# particular band is still twitchy at true silence.
squelch_db = 10

# Auto level (1.16): the display fills to whatever volume the music is at,
# for looks rather than measurement -- see README "Auto level". "off" goes
# back to the gated auto-gain above (sensitivity / noise_gate_db /
# squelch_db, which only apply then). Also flipped live from the ABOUT
# screen with Left/Right. Keep gain_bias at 0 with it on.
auto_level = on

# Mid-band level (dBFS, ~150ms smoothed) below which, for 2.5s, counts as
# silence: the display goes dark and the gain holds. Set it just above the
# quiet room -- P1's room reads about -58 with the fans running, and low
# music about -53. Too high and quiet music goes dark; too low and the
# room's own noise never counts as silence.
silence_db = -56.5

# dB range below the peaks each bar covers (raised per band to clear that
# band's own room noise).
auto_span_db = 30

# Learned automatically -- each band's room noise (post-tilt dB), saved
# after every silence of 3s or more. Delete the line to relearn it.
# room_noise =
